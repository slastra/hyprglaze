name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    name: build & test (zig ${{ matrix.zig || 'minimum' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # '' = minimum_zig_version from build.zig.zon (what the package
        # promises); latest = newest tagged release; master = nightly, as an
        # early warning for the next release. Only master may fail.
        zig: ['', latest, master]
    continue-on-error: ${{ matrix.zig == 'master' }}
    container:
      image: archlinux:latest
    steps:
      - name: Install system packages
        # Arch container is the canonical build environment (PKGBUILD path).
        # nodejs is needed by actions/checkout; git for fetching deps.
        # Protocol XMLs are vendored in protocols/; wayland-scanner comes
        # with wayland.
        run: |
          pacman -Syu --noconfirm --needed \
            wayland mesa libglvnd stb libpulse glslang \
            base-devel git nodejs

      - uses: actions/checkout@v7

      # Zig per the matrix above, not whatever Arch ships today.
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ matrix.zig }}

      - name: Validate shaders
        run: |
          for f in shaders/*.frag tools/harness_probe.frag; do
            glslangValidator "$f" || exit 1
          done

      - name: zig build test
        run: zig build test

      - name: zig build (Debug)
        run: zig build

      - name: zig build (ReleaseSafe)
        # Matches the PKGBUILD optimize flag.
        run: zig build --release=safe
